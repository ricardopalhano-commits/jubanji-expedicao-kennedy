<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jubanji: Expedição dos Biomas</title>
  <meta name="theme-color" content="#16241a">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <h1 class="sr">Jubanji: Expedição dos Biomas</h1>
  <main>
    <section id="menu">
      <img class="banner" src="/img/menu.jpg" alt="Mundo Jubanji: biomas do jogo">
      <form id="inicio">
        <label>Nome do explorador
          <input id="nome" required maxlength="30" placeholder="Ex.: Ricardo">
        </label>
        <button type="submit">Começar expedição</button>
      </form>
      <p class="como">Mova o lobo com as setas ← → (ou arrastando o dedo). Pegue 8 suprimentos em cada fase, desvie dos perigos e responda às perguntas da escola!</p>
      <button id="instalar" class="sec" hidden>Instalar app</button>
    </section>

    <section id="jogo" hidden>
      <div class="palco">
        <canvas id="cv" width="880" height="480" aria-label="Área do jogo"></canvas>
        <div id="quiz" hidden></div>
      </div>
    </section>

    <section id="fim" hidden>
      <img id="imgfim" class="banner" src="/img/vitoria.jpg" alt="Vitória na expedição">
      <p id="msg" role="status"></p>
      <button id="again">Jogar de novo</button>
    </section>

    <section id="rank">
      <h2>Ranking dos exploradores</h2>
      <ol id="lista"></ol>
    </section>
  </main>
  <script src="/app.js"></script>
</body>
</html>
