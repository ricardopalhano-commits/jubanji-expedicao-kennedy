<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarefas</title>
  <meta name="theme-color" content="#1f4e5f">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Tarefas</h1>
    <p id="resumo" aria-live="polite"></p>
    <button id="instalar" hidden>Instalar app</button>
  </header>

  <main>
    <form id="form" autocomplete="off">
      <h2 id="form-titulo">Nova tarefa</h2>
      <input type="hidden" id="id">
      <label>Título
        <input id="titulo" required maxlength="120" placeholder="Ex.: Entregar trabalho de Web">
      </label>
      <label>Descrição
        <textarea id="descricao" rows="2" placeholder="Detalhes (opcional)"></textarea>
      </label>
      <label>Prioridade
        <select id="prioridade">
          <option value="baixa">Baixa</option>
          <option value="media" selected>Média</option>
          <option value="alta">Alta</option>
        </select>
      </label>
      <div class="acoes">
        <button type="submit" id="salvar">Adicionar tarefa</button>
        <button type="button" id="cancelar" class="sec" hidden>Cancelar edição</button>
      </div>
      <p id="erro" role="alert"></p>
    </form>

    <section>
      <div class="filtros" role="group" aria-label="Filtrar">
        <button data-f="todas" class="on">Todas</button>
        <button data-f="pendentes">Pendentes</button>
        <button data-f="concluidas">Concluídas</button>
      </div>
      <ul id="lista"></ul>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
